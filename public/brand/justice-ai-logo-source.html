<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Justice AI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .logo-page {
      width: 1200px;
      height: 1200px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 62px;
      padding: 120px;
      overflow: hidden;
    }
    .brand-mark { display: block; width: 360px; height: 360px; flex: 0 0 auto; }
    .wordmark {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 26px;
      margin: 0;
      color: #16243b;
      font-size: 144px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -6px;
      white-space: nowrap;
    }
    .wordmark-ai { color: #a5792e; letter-spacing: -4px; }
  </style>
</head>
<body>
  <main class="logo-page" data-document-role="page" data-document-name="Justice AI" aria-label="Justice AI logo">
    <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Gold scales of justice on a navy rounded square">
      <title>Justice AI</title>
      <rect x="2" y="2" width="92" height="92" rx="25" fill="#16243B"/>
      <rect x="2.75" y="2.75" width="90.5" height="90.5" rx="24.25" stroke="#D7B46A" stroke-opacity=".35" stroke-width="1.5"/>
      <path d="M48 25v45M30 71h36M48 30 23 37m25-7 25 7" stroke="#E4C17B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="48" cy="23" r="4" fill="#E4C17B"/>
      <path d="m27 36-10 19h20L27 36Zm42 0L59 55h20L69 36Z" stroke="#E4C17B" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M17 55c0 6 4.5 9 10 9s10-3 10-9H17Zm42 0c0 6 4.5 9 10 9s10-3 10-9H59Z" fill="#E4C17B"/>
    </svg>
    <h1 class="wordmark"><span>Justice</span><span class="wordmark-ai">AI</span></h1>
  </main>
</body>
</html>
